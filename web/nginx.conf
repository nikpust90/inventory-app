server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # Увеличиваем лимит размера URL для длинных запросов с warehouse IDs
    # При большом количестве складов URL может быть очень длинным
    large_client_header_buffers 8 64k;
    client_header_buffer_size 64k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Проксирование запросов к 1С (авторизация и остатки)
    location /api/inventory_documents/ {
        
        # ВАЖНО: СО слэшем в конце для правильной передачи пути
        # /api/inventory_documents/login -> /Stavtrack_UNF/hs/inventory_documents/login
        proxy_pass http://89.108.72.168/Stavtrack_UNF/hs/inventory_documents/;
        proxy_http_version 1.1;
        
        # Basic Auth для 1С
        # Логин: ПустоветовН, Пароль: 7jusaveZ
        # Base64 сгенерирован командой: echo -n "ПустоветовН:7jusaveZ" | base64
        # Результат: 0J/Rg9GB0YLQvtCy0LXRgtC+0LLQnTo3anVzYXZlWg==
        proxy_set_header Authorization "Basic 0J/Rg9GB0YLQvtCy0LXRgtC+0LLQnTo3anVzYXZlWg==";
        
        # Host БЕЗ кавычек (nginx переменная)
        proxy_set_header Host 89.108.72.168;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # ВАЖНО: Не переопределяем Content-Type, пусть клиент передает свой
        # proxy_set_header Content-Type удален - используем оригинальный от клиента
        
        proxy_set_header Accept "application/json";
        
        # Убираем WWW-Authenticate из ответа
        proxy_hide_header WWW-Authenticate;
        
        # Увеличенные таймауты для 1С
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    # Проксирование API запросов к Python backend (для автомобилей)
    location /api/cars/ {
        proxy_pass http://api_backend:8000/api/cars/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Статические файлы React приложения
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Кэширование статических ресурсов
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
