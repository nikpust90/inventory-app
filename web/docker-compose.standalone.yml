version: '3.9'

# Отдельный docker-compose для веб-приложения
# Используется с флагом -p для изоляции проекта
services:
  car-scheme-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car-scheme-web
    ports:
      - "3001:80"
    restart: unless-stopped
    networks:
      - car-scheme-network

networks:
  car-scheme-network:
    driver: bridge
