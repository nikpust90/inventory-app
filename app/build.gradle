plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-kapt'
}

android {
    namespace 'com.example.inventory_app'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.inventory_app"
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName "6.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
        compose false  // Отключаем Compose, если не используем
        buildConfig true
    }
    viewBinding {
        enabled = true
    }
    packagingOptions {
        resources {
            excludes += [
                    "META-INF/INDEX.LIST",
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/io.netty.versions.properties"
            ]
        }
    }
}

dependencies {

// Базовые зависимости Android
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Room Database (ИСПРАВЛЕННЫЕ ЗАВИСИМОСТИ)
    def room_version = "2.6.1"  // Используем стабильную версию
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"  // Для Kotlin поддержки
    kapt "androidx.room:room-compiler:$room_version"  // ЗАМЕНИТЕ annotationProcessor на kapt

    // WorkManager
    implementation "androidx.work:work-runtime:2.8.1"
    implementation "androidx.work:work-runtime-ktx:2.8.1"  // Kotlin поддержка

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.8.9'

    // QR Code Scanner
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Date/Time
    implementation 'org.threeten:threetenbp:1.5.1'

    // Compose (если используете)
    implementation 'androidx.compose.ui:ui:1.5.4'
    implementation 'androidx.compose.material3:material3:1.1.2'

    // Тестирование
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Для работы с Яндекс.Диск API
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Для работы с изображениями
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.1'

    // Для выбора файлов
    implementation 'com.github.dhaval2404:imagepicker:2.1'

    // ГЛАВНОЕ: Библиотека для логов (добавь эту строку)
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'



}